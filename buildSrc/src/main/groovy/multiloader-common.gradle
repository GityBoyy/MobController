plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    // Only generate javadoc in CI or when explicitly requested
    if (System.getenv("CI") || project.hasProperty("generateJavadoc")) {
        withJavadocJar()
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('html5', true)
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                }
        )
        filter {
            includeGroup('org.parchmentmc.data')
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = "https://cursemaven.com"
                content {
                    includeGroup "curse.maven"
                }
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Optimize capability declarations
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

// Add javadocElements only when javadoc is generated
if (System.getenv("CI") || project.hasProperty("generateJavadoc")) {
    configurations.javadocElements.outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "license_${mod_id}.txt" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "license_${mod_id}.txt" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
                'Built-On-Java'         : System.getProperty('java.version'),
                'Built-By'              : System.getProperty('user.name'),
                'Build-Time'            : new Date().toString(),
                'CurseForge'            : curse_page,
                'Modrinth'              : modrinth_page
        ])
    }

    // Exclude development files
    exclude 'META-INF/maven/**'
    exclude '**/*.psd'
    exclude '**/*.xcf'
}

processResources {
    def expandProps = [
            "group"                        : project.group,
            "minecraft_version"            : minecraft_version,
            "minecraft_version_range"      : minecraft_version_range,
            "fabric_version"               : fabric_version,
            "fabric_loader_version"        : fabric_loader_version,
            "neoforge_version"             : neoforge_version,
            "neoforge_version_range"       : neoforge_loader_version_range,
            "neoforge_loader_version_range": neoforge_loader_version_range,
            "crafttweaker_version"         : crafttweaker_version,
            "jei_version"                  : jei_version,
            "mod_name"                     : mod_name,
            "mod_version"                  : mod_version,
            "mod_author"                   : mod_author,
            "mod_id"                       : mod_id,
            "mod_license"                  : mod_license,
            "mod_desc"                     : mod_description,
            "mod_source"                   : mod_repo,
            "mod_issues"                   : mod_issues
    ]

    filesMatching([
            'pack.mcmeta',
            'fabric.mod.json',
            'META-INF/mods.toml',
            'META-INF/neoforge.mods.toml',
            '*.mixins.json'
    ]) {
        expand expandProps
    }

    inputs.properties(expandProps)

    // Enable incremental processing
    outputs.upToDateWhen { true }
}

// Optimize compilation tasks
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            '-Xlint:none',
            '-nowarn',
            '-parameters'
    ])
    options.fork = true
    options.forkOptions.jvmArgs.addAll([
            '-XX:+UseParallelGC',
            '-Xmx2G'
    ])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java

            pom {
                name = mod_name
                description = mod_description
                url = mod_repo

                licenses {
                    license {
                        name = mod_license
                    }
                }

                developers {
                    developer {
                        name = mod_author
                    }
                }

                scm {
                    url = mod_repo
                }
            }
        }
    }

    repositories {
        if (System.getenv('local_maven_url')) {
            maven {
                url System.getenv('local_maven_url')
            }
        }
    }
}