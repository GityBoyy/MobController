plugins {
    id 'multiloader-loader'
    id 'net.neoforged.gradle.userdev' version '7.0.167'
}

def at = file('src/main/resources/META-INF/accesstransformer.cfg')
if (at.exists()) {
    minecraft.accessTransformers.file at
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroupAndSubgroups("com.blamejared")
        }
    }
}

dependencies {
    // Core dependencies with optimized configurations
    implementation("net.neoforged:neoforge:${neoforge_version}") {
        exclude group: 'org.apache.maven'
    }

    // JEI with proper scope
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // CraftTweaker optimized
    compileOnly "com.blamejared.crafttweaker:CraftTweaker-common-${minecraft_version}:${crafttweaker_version}"
    runtimeOnly("com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}") {
        exclude group: "me.shedaniel", module: "RoughlyEnoughItems-neoforge"
    }
}

// Optimize compilation
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            '-Xlint:none',
            '-nowarn'
    ])
    options.fork = true
    options.forkOptions.jvmArgs.addAll([
            '-XX:+UseParallelGC',
            '-Xmx2G'
    ])
}

// Optimize JAR creation
jar {
    archiveClassifier = ''

    // Exclude unnecessary files
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**'
    exclude '**/*.psd'
    exclude '**/*.xcf'

    from(rootProject.file('LICENSE')) {
        rename { "${mod_id}_LICENSE.txt" }
    }
}

// IDE optimizations
idea {
    module {
        downloadSources = true
        downloadJavadoc = false // Disable to save time
        inheritOutputDirs = true
    }
}